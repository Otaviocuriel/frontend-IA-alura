<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflix</title>
    <link rel="stylesheet" href="/styles.css" />
    
 </head>
  <body>
    <main>
      <nav class="topbar" aria-label="Navegação principal">
        <strong class="brand" aria-label="Netflix">NETFLIX</strong>
        <button class="topbar-button" type="button">Entrar</button>
      </nav>

      <header>
        <h1>Quem está assistindo?</h1>
        <p>Escolha um perfil para continuar assistindo seus favoritos.</p>
      </header>

      <section aria-label="Seleção de perfis">
        <ul class="profiles">
          <li class="profile">
            <article>
              <figure>
                <img src="/assests/perfil-1.png" alt="Um homem sentado no banco da praça feliz" />
                <figcaption>Joaquim</figcaption>
              </figure>
            </article>
          </li>

          <li class="profile">
            <article>
              <figure>
                <img src="/assests/perfil-2.png" alt="Uma mulher sorridente sentada em uma cadeira de praça" />
                <figcaption>Claude</figcaption>
              </figure>
            </article>
          </li>
        </ul>
      </section>

      <footer>
        <button class="manage-button" type="button">Gerenciar perfis</button>
      </footer>

    </main>
  </body>
</html>
